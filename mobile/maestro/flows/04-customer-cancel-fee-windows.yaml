appId: com.famy.app
---
- runFlow:
    file: 01-customer-sign-in.yaml
    env:
      MAESTRO_TEST_PHONE: ${MAESTRO_TEST_PHONE}
      MAESTRO_TEST_OTP: ${MAESTRO_TEST_OTP}
- tapOn:
    id: "tab-bookings"
- assertVisible:
    id: "bookings-list-screen"
- assertVisible:
    id: "booking-row-${MAESTRO_QA_BOOKING_ID}"
- tapOn:
    id: "booking-row-${MAESTRO_QA_BOOKING_ID}"
- assertVisible:
    id: "booking-status"