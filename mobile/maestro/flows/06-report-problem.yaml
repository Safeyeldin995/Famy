appId: com.famy.app
---
- runFlow:
    file: 01-customer-sign-in.yaml
    env:
      MAESTRO_TEST_PHONE: ${MAESTRO_TEST_PHONE}
      MAESTRO_TEST_OTP: ${MAESTRO_TEST_OTP}
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "profile-help-link"
- assertVisible:
    id: "help-report-issue"
- assertVisible:
    id: "help-screen"
- assertVisible:
    id: "help-report-issue"
- tapOn:
    id: "help-report-issue"