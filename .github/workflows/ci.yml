name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.4

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # Root Vitest includes mobile/vitest.config.ts and its real runtime imports.
      - name: Install mobile test dependencies
        run: npm ci --prefix mobile

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Validate QA modules
        shell: bash
        run: |
          find qa -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Guard single Firebase reCAPTCHA container
        run: node qa/check-firebase-recaptcha-container.mjs

      - name: Check Arabic locale for tashkeel
        run: node qa/check-ar-tashkeel.mjs

      - name: Check Arabic locale for UI periods
        run: node qa/check-ar-periods.mjs

      - name: Check Arabic locale plural forms
        run: node qa/check-ar-plurals.mjs

      - name: Validate Maestro release flows
        run: node qa/check-maestro-flows.mjs

  release-gate:
    name: Release gate (money + monitoring)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sentry scrub + release flag unit tests
        run: |
          npm run test:unit -- src/lib/sentry/__tests__/scrub.test.ts
          npm run test:unit -- src/lib/db/__tests__/release-features.test.ts
          npm run test:unit -- src/lib/db/__tests__/release-gate-wallet-lock.test.ts

      - name: Money RPC regression (PGlite)
        run: |
          npm run test:unit -- \
            src/lib/db/__tests__/money-journey.test.ts \
            src/lib/db/__tests__/cancellation-fee.test.ts \
            src/lib/db/__tests__/expire-pending-bookings.test.ts

      - name: Release gate admin E2E
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          QA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
          FAMY_ENV: qa
        run: |
          if [ -z "$QA_SUPABASE_URL" ]; then
            echo "Skipping admin E2E — configure QA_SUPABASE_* repository secrets for full release gate."
            exit 0
          fi
          npm run test:release-gate:admin

  mobile:
    name: Mobile typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Accessibility and RTL static checks
        run: node qa/a11y-rtl.cjs

      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/mobile-export
