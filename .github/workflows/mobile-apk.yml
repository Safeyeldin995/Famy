name: Mobile preview APK

# Builds the Android preview/development APK from the chosen ref.
# Default: EAS local build on the GitHub runner (no EAS cloud build quota).
# Optional: EAS cloud build (legacy path) when runner=eas-cloud.
# Needs repository secret EXPO_TOKEN (Expo access token). Signing, Maps keys,
# and google-services.json stay in EAS — nothing secret is committed or logged.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - development
      runner:
        description: "Where to run the Android build"
        required: true
        default: github
        type: choice
        options:
          - github
          - eas-cloud

permissions:
  contents: read
  actions: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-eas-cloud:
    name: Start EAS Android build (cloud)
    if: inputs.runner == 'eas-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions) to enable cloud APK builds."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start build
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" \
            --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const b = Array.isArray(raw) ? raw[0] : raw;
            const owner = b?.project?.ownerAccount?.name ?? "safeyeldin";
            const slug = b?.project?.slug ?? "famy";
            const url = `https://expo.dev/accounts/${owner}/projects/${slug}/builds/${b?.id}`;
            console.log(`EAS build: ${url}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Android build started\n\n- Commit: ${b?.gitCommitHash ?? process.env.GITHUB_SHA}\n- Build: ${url}\n\nThe APK link appears on the build page when it finishes.\n`);
          ' "$RUNNER_TEMP/build.json"

  build-github-runner:
    name: Build Android APK on runner
    if: inputs.runner == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions) to enable APK builds."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Short SHA
        id: short_sha
        working-directory: .
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # EAS file variables with "Secret" visibility are not available to local
      # builds, so google-services.json comes from the GitHub secret
      # GOOGLE_SERVICES_JSON (the file's full text). It is written outside the
      # repo and never printed.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON repository secret (the full text of the Android google-services.json) to build on the GitHub runner."
            exit 1
          fi
          gs_path="$RUNNER_TEMP/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$gs_path"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$gs_path" \
            || { echo "::error::The GOOGLE_SERVICES_JSON secret is not valid JSON."; exit 1; }
          echo "GOOGLE_SERVICES_JSON=$gs_path" >> "$GITHUB_ENV"

      - name: Build APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          apk_path="$RUNNER_TEMP/famy-${{ inputs.profile }}.apk"
          eas build --platform android --profile "${{ inputs.profile }}" \
            --local --non-interactive --output "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: famy-android-${{ inputs.profile }}-${{ steps.short_sha.outputs.sha }}
          path: ${{ env.apk_path }}
          retention-days: 14

      - name: Publish artifact link
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: .
        run: |
          {
            echo "### Android APK (GitHub runner)"
            echo ""
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Commit: \`${{ steps.short_sha.outputs.sha }}\`"
            echo ""
            echo "Download the APK from the [workflow run artifacts](${RUN_URL}#artifacts)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK artifact: ${RUN_URL}#artifacts"
