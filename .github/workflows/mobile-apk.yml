name: Mobile preview APK

# Starts an EAS cloud build of the Android preview APK from the chosen ref,
# so new test builds do not need the Product Owner's PC.
# Needs the repository secret EXPO_TOKEN (an Expo access token). Maps keys,
# google-services.json and signing credentials stay in EAS, not in GitHub.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - development

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Start EAS Android build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions) to enable cloud APK builds."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start build
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" \
            --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const b = Array.isArray(raw) ? raw[0] : raw;
            const owner = b?.project?.ownerAccount?.name ?? "safeyeldin";
            const slug = b?.project?.slug ?? "famy";
            const url = `https://expo.dev/accounts/${owner}/projects/${slug}/builds/${b?.id}`;
            console.log(`EAS build: ${url}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Android build started\n\n- Commit: ${b?.gitCommitHash ?? process.env.GITHUB_SHA}\n- Build: ${url}\n\nThe APK link appears on the build page when it finishes.\n`);
          ' "$RUNNER_TEMP/build.json"
